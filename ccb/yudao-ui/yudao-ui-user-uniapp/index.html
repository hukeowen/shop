<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#FF6B35" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6B35'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='-apple-system,sans-serif' font-weight='900' font-size='18' fill='white'%3E客%3C/text%3E%3C/svg%3E" />
    <title>客小二</title>
    <!--preload-links-->
    <!--app-context-->
    <script>
      // 店铺分享落地早期重定向（必须在 uniapp bundle 加载前同步跑）。
      // https://ke.doupaidoudian.com/u/shop-home?tenantId=1010&inviter=99012
      // → fallback /u/index.html → URL 留 ?tenantId — 直接 mount 首页 + 401 重定向会覆盖 shop-home。
      // 这里把 URL 改写成 #/pages/shop/home?tenantId=...&inviter=... hash 形式，绕开抢路由问题。
      (function () {
        try {
          if (typeof location === 'undefined' || !location.search) return;
          if (!/[?&]tenantId=/.test(location.search)) return;
          if (location.hash && location.hash.indexOf('#/pages/shop/home') === 0) return;
          var sp = new URLSearchParams(location.search);
          var tenantId = sp.get('tenantId');
          if (!tenantId) return;
          var inviter = sp.get('inviter') || sp.get('referrerUserId') || '';
          var qs = 'tenantId=' + encodeURIComponent(tenantId);
          if (inviter) qs += '&inviter=' + encodeURIComponent(inviter);
          var target = location.pathname.replace(/[^/]+$/, '') + '#/pages/shop/home?' + qs;
          history.replaceState(null, '', target);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
