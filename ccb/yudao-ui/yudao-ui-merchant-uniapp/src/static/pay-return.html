<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>支付完成</title>
<style>
  html,body{margin:0;padding:0;background:linear-gradient(180deg,#fff6ee 0%,#f7f8fa 40%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a1d24;}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
  .check{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#4ade80,#22c55e);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(34,197,94,.35);margin-bottom:24px;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;}
  .check span{color:#fff;font-size:48px;font-weight:800;line-height:1;}
  @keyframes pop{0%{transform:scale(0);}100%{transform:scale(1);}}
  .h1{font-size:22px;font-weight:800;margin-bottom:12px;}
  .sub{font-size:14px;color:#5a6577;margin-bottom:8px;}
  .tip{font-size:13px;color:#9aa3b1;}
  .btn{margin-top:32px;padding:14px 48px;background:#ff6b35;color:#fff;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;display:inline-block;box-shadow:0 8px 20px rgba(255,107,53,.25);}
</style>
</head>
<body>
<div class="wrap">
  <div class="check"><span>✓</span></div>
  <div class="h1" id="title">支付成功</div>
  <div class="sub" id="sub">正在为你跳转…</div>
  <div class="tip" id="countdown">3 秒后自动跳转</div>
  <a class="btn" href="#" id="goNow">立即进入</a>
</div>
<script>
// Allinpay returnUrl 着陆页。本页通常被嵌在微信「支付完成」iframe 里 → 必须用点金计划
// postMessage(onIframeReady, SHOW_CUSTOM_PAGE) 隐藏底部「点金计划」广告，
// 然后 postMessage(jumpOut, jumpOutUrl) 把顶层换成商户 / 顾客的真实主页。
//
// 场景区分：
//   ?type=saas  → 商户买套餐 → 跳 tuo.doupaidoudian.com/m/#/pages/me/subscription-paid
//   ?type=trade → 顾客订单付款 → 跳 ke.doupaidoudian.com/m/#/pages/order/pay-done?orderId=X
//   未指定     → fallback 商户工作台（旧链路兼容）

function qs(name) {
  var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

var type = qs('type') || 'saas';
var oid = qs('oid');
var tenantId = qs('tenantId');

var title = '支付成功', sub = '正在为你跳转…', target = '';
if (type === 'trade') {
  title = '订单支付成功';
  sub = '正在返回商家页面…';
  target = 'https://ke.doupaidoudian.com/m/#/pages/order/pay-done?orderId=' + encodeURIComponent(oid || '');
  if (tenantId) target += '&tenantId=' + encodeURIComponent(tenantId);
} else {
  title = '套餐购买成功';
  sub = 'SaaS 服务已激活';
  target = 'https://tuo.doupaidoudian.com/m/#/pages/me/subscription-paid?paid=1';
}

document.getElementById('title').innerText = title;
document.getElementById('sub').innerText = sub;
document.getElementById('goNow').href = target;

// 嵌在微信 payapp 里：先告知"切到自定义页 + 隐藏广告"
function postToWx(data) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(JSON.stringify(data), 'https://payapp.weixin.qq.com');
      return true;
    }
  } catch (e) {}
  return false;
}

var inIframe = (function () {
  try { return window.parent && window.parent !== window; } catch (e) { return false; }
})();

if (inIframe) {
  postToWx({ action: 'onIframeReady', displayStyle: 'SHOW_CUSTOM_PAGE' });
}

// 倒计时 3 秒：iframe 中走 jumpOut（彻底跳出微信壳）；非 iframe fallback 普通跳转
var n = 3;
var timer = setInterval(function () {
  n--;
  if (n <= 0) {
    clearInterval(timer);
    if (inIframe) {
      postToWx({ action: 'jumpOut', jumpOutUrl: target });
      // 兜底：300ms 没跳成自己跳
      setTimeout(function () { location.href = target; }, 300);
    } else {
      location.href = target;
    }
  } else {
    document.getElementById('countdown').innerText = n + ' 秒后自动跳转';
  }
}, 1000);

// 点按钮也优先 jumpOut
document.getElementById('goNow').addEventListener('click', function (e) {
  if (inIframe) {
    e.preventDefault();
    postToWx({ action: 'jumpOut', jumpOutUrl: target });
    setTimeout(function () { location.href = target; }, 300);
  }
});
</script>
</body>
</html>
