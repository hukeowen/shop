<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>蓝工 · 登录</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../shared/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen pb-10">

<div class="text-center pt-6">
  <a href="../index.html" class="text-sm text-slate-500 hover:text-blue-600">← 返回原型导航</a>
</div>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-screen">
    <div class="status-bar"><span>9:41</span><span class="flex gap-1 items-center"><span>●●●●●</span><span class="text-xs">5G</span><span class="text-xs">100%</span></span></div>

    <div class="phone-content">

      <!-- 顶部装饰 -->
      <div class="grad-blue h-48 relative overflow-hidden">
        <div class="absolute -top-20 -right-20 w-64 h-64 bg-white/10 rounded-full"></div>
        <div class="absolute -bottom-16 -left-16 w-48 h-48 bg-white/5 rounded-full"></div>
        <div class="relative pt-8 px-6 text-white">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-14 h-14 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center text-2xl font-extrabold border border-white/30">蓝</div>
            <div>
              <div class="text-2xl font-extrabold tracking-wide">蓝工</div>
              <div class="text-xs opacity-80">BLUECOLLAR</div>
            </div>
          </div>
          <h1 class="text-3xl font-extrabold mt-4">找好活，攒工分</h1>
          <p class="text-sm opacity-90 mt-1">8000万蓝领工人的灵活就业平台</p>
        </div>
      </div>

      <!-- 表单卡片 -->
      <div class="px-6 -mt-6 relative">
        <div class="bg-white rounded-2xl shadow-xl p-5">

          <!-- Tab -->
          <div class="flex gap-6 border-b border-slate-100 mb-5">
            <button class="pb-3 text-base font-bold text-slate-900 border-b-2 border-blue-600">手机号登录</button>
            <button class="pb-3 text-sm text-slate-400">密码登录</button>
          </div>

          <!-- 手机号 -->
          <div class="mb-4">
            <label class="text-xs text-slate-400">手机号</label>
            <div class="flex items-center gap-2 mt-1 border-b border-slate-200 pb-2">
              <span class="text-sm text-slate-700 font-medium">+86</span>
              <svg width="12" height="12" fill="none" stroke="#94A3B8" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
              <input class="flex-1 outline-none text-base text-slate-900 placeholder:text-slate-300" placeholder="请输入手机号" value="138 1234 5678"/>
            </div>
          </div>

          <!-- 验证码 -->
          <div class="mb-5">
            <label class="text-xs text-slate-400">验证码</label>
            <div class="flex items-center gap-2 mt-1 border-b border-slate-200 pb-2">
              <input class="flex-1 outline-none text-base text-slate-900 placeholder:text-slate-300 tracking-widest" placeholder="6位验证码"/>
              <button class="text-xs text-blue-600 font-semibold whitespace-nowrap">获取验证码</button>
            </div>
          </div>

          <!-- 登录按钮 -->
          <a href="home.html" class="block w-full text-center bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 active:scale-95 transition">登录 / 注册</a>

          <!-- 协议勾选 -->
          <label class="flex items-start gap-2 mt-3 text-xs text-slate-500">
            <input type="checkbox" checked class="mt-0.5 accent-blue-600">
            <span>我已阅读并同意 <a class="text-blue-600">《用户协议》</a> 与 <a class="text-blue-600">《隐私政策》</a></span>
          </label>
        </div>

        <!-- 三方登录 -->
        <div class="mt-8">
          <div class="flex items-center gap-3 text-xs text-slate-400 mb-5">
            <span class="flex-1 h-px bg-slate-200"></span>
            <span>其他登录方式</span>
            <span class="flex-1 h-px bg-slate-200"></span>
          </div>
          <div class="flex justify-center gap-8">
            <button class="flex flex-col items-center gap-1">
              <div class="w-12 h-12 rounded-full bg-green-500 flex items-center justify-center shadow">
                <svg width="26" height="26" fill="#fff" viewBox="0 0 24 24"><path d="M8.5 14.5c-.3 0-.6-.3-.6-.6s.3-.6.6-.6.6.3.6.6-.3.6-.6.6zm7 0c-.3 0-.6-.3-.6-.6s.3-.6.6-.6.6.3.6.6-.3.6-.6.6zM12 4C6 4 1 8 1 13c0 2.5 1.5 4.7 4 6.3-.1.5-.5 1.8-.6 2.1 0 .2.2.4.4.4.1 0 .2 0 .3-.1l2.7-1.6c1.3.3 2.7.5 4.2.5 6 0 11-4 11-9s-5-9-11-9z"/></svg>
              </div>
              <span class="text-xs text-slate-500">微信</span>
            </button>
            <button class="flex flex-col items-center gap-1">
              <div class="w-12 h-12 rounded-full bg-blue-500 flex items-center justify-center shadow">
                <svg width="22" height="22" fill="#fff" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14H8v-6h2v6zm-1-6.8c-.7 0-1.2-.5-1.2-1.2s.5-1.2 1.2-1.2 1.2.5 1.2 1.2-.5 1.2-1.2 1.2zM17 16h-2v-3c0-.8-.3-1.3-1-1.3s-1 .5-1 1.3v3h-2v-6h2v.9c.3-.5 1-1.1 2-1.1 1.5 0 2 1 2 2.5V16z"/></svg>
              </div>
              <span class="text-xs text-slate-500">支付宝</span>
            </button>
            <button class="flex flex-col items-center gap-1">
              <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center shadow">
                <svg width="22" height="22" fill="#fff" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </div>
              <span class="text-xs text-slate-500">一键登录</span>
            </button>
          </div>
        </div>

        <!-- 实名引导卡 -->
        <div class="mt-6 bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-start gap-2">
          <svg width="18" height="18" fill="none" stroke="#F59E0B" stroke-width="2" viewBox="0 0 24 24" class="mt-0.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <div class="text-xs text-amber-800 leading-relaxed">
            <span class="font-bold">温馨提示：</span>登录后需完成实名认证才能积累工分、签合同、领工资。蓝工严格保护您的身份信息。
          </div>
        </div>

      </div>

      <!-- 底部协议 -->
      <div class="mt-12 pb-6 text-center">
        <div class="text-[11px] text-slate-400">登录即代表同意 <a class="text-slate-500 underline">用户协议</a> · <a class="text-slate-500 underline">隐私政策</a></div>
        <div class="text-[11px] text-slate-400 mt-1">浙ICP备2026000001号 · 人力资源服务许可证 330106XXX</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
