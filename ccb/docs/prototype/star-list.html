<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>店铺星级（列表）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1a1d24; background: #f6f7f9; }
  body { max-width: 540px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }
  .topbar {
    display: flex; align-items: center; padding: 16px;
    background: #fff; border-bottom: 1px solid #eaeef2; position: sticky; top: 0; z-index: 10;
  }
  .topbar .back { font-size: 24px; color: #1a1d24; width: 32px; }
  .topbar .title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; }

  .info-tip {
    margin: 12px; padding: 14px 16px;
    background: linear-gradient(135deg, #fff5ef, #ffe1c8);
    border-left: 4px solid #ff6b35;
    border-radius: 10px;
    font-size: 13px; color: #1a1d24; line-height: 1.55;
  }
  .info-tip .b { font-weight: 700; color: #ff6b35; }

  .section-title {
    padding: 8px 20px 8px;
    font-size: 13px; color: #6b7280; font-weight: 600;
  }

  .list { padding: 0 16px; }
  .shop-row {
    display: flex; align-items: center; gap: 12px;
    padding: 16px; margin-bottom: 10px;
    background: #fff; border-radius: 12px;
    box-shadow: 0 1px 4px rgba(15,23,42,.04);
    position: relative;
    cursor: pointer;
  }
  .shop-row.ranked { border: 2px solid transparent; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, #ffd6b8, #ff6b35) border-box; border-image: none; }
  .shop-row .rank-badge {
    position: absolute; top: -8px; left: 12px;
    padding: 2px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #ff6b35, #ff9a4a);
    box-shadow: 0 4px 10px rgba(255,107,53,.35);
  }
  .shop-pic {
    width: 48px; height: 48px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  .shop-info { flex: 1; min-width: 0; }
  .shop-name { font-size: 16px; font-weight: 600; color: #1a1d24; }
  .shop-meta {
    margin-top: 6px; font-size: 12px; color: #5a6577;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .meta-star {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 10px;
    background: linear-gradient(135deg, #fff5ef, #ffd1ba);
    color: #ff6b35; border-radius: 999px;
    font-weight: 700;
  }
  .meta-star.zero { background: #f6f7f9; color: #9ca3af; font-weight: 500; }
  .meta-sep { color: #d1d5db; }
  .meta-pts { color: #5a6577; font-variant-numeric: tabular-nums; }
  .arrow { color: #c5c8cf; font-size: 22px; padding-left: 6px; }

  .empty {
    text-align: center; padding: 80px 60px; color: #9ca3af;
  }
  .empty .emoji { font-size: 56px; opacity: .5; margin-bottom: 14px; }
  .empty .title { font-size: 16px; font-weight: 700; color: #1a1d24; }
  .empty .sub { margin-top: 6px; font-size: 13px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="back">‹</div>
    <div class="title">店铺星级</div>
    <div style="width:32px"></div>
  </div>

  <div class="info-tip">
    <span class="b">星级 = 商品级会员等级。</span>
    不同店、不同商品有各自的升星条件。下方按店列出你所在的店，已升星的优先展示，点击查看店内每个商品的明细。
  </div>

  <!-- 已满足推广条件（买过推 N 反 1 商品）-->
  <div class="section-title">🎯 已满足推广条件（2 家）</div>
  <div class="list">
    <div class="shop-row ranked">
      <span class="rank-badge">TOP 1</span>
      <div class="shop-pic" style="background:linear-gradient(135deg,#ff9a4a,#ff6b35)">爱</div>
      <div class="shop-info">
        <div class="shop-name">爱家超市</div>
        <div class="shop-meta">
          <span class="meta-star">⭐⭐⭐</span>
          <span class="meta-sep">·</span>
          <span class="meta-pts">推广 12.50 积分</span>
          <span class="meta-sep">·</span>
          <span class="meta-pts">消费 191.00 积分</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="shop-row">
      <div class="shop-pic" style="background:linear-gradient(135deg,#c9e0ff,#6196f0)">老</div>
      <div class="shop-info">
        <div class="shop-name">老王烧烤摊</div>
        <div class="shop-meta">
          <span class="meta-star">⭐</span>
          <span class="meta-sep">·</span>
          <span class="meta-pts">推广 3.20 积分</span>
          <span class="meta-sep">·</span>
          <span class="meta-pts">消费 40.00 积分</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </div>
  </div>

  <!-- 普通会员（未购推广商品） -->
  <div class="section-title">📦 普通会员（未购推 N 反 1 商品）</div>
  <div class="list">
    <div class="shop-row">
      <div class="shop-pic" style="background:linear-gradient(135deg,#d3f4d3,#4cb84c)">水</div>
      <div class="shop-info">
        <div class="shop-name">水果店</div>
        <div class="shop-meta">
          <span class="meta-star zero">无星级</span>
          <span class="meta-sep">·</span>
          <span class="meta-pts">推广 0.00 积分</span>
          <span class="meta-sep">·</span>
          <span class="meta-pts">消费 5 积分</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </div>

    <div class="shop-row">
      <div class="shop-pic" style="background:linear-gradient(135deg,#ffd0dc,#ee5a8b)">奶</div>
      <div class="shop-info">
        <div class="shop-name">阿宁奶茶店</div>
        <div class="shop-meta">
          <span class="meta-star zero">无星级</span>
          <span class="meta-sep">·</span>
          <span class="meta-pts">推广 0.00 积分</span>
          <span class="meta-sep">·</span>
          <span class="meta-pts">消费 0 积分</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </div>
  </div>
</body>
</html>
