<!DOCTYPE html> 
<html lang="zh-cmn-Hans"> 
<head>
    <meta charset='utf-8'>
    <meta name="viewport" content="initial-scale=1, maximum-scale=3, minimum-scale=1, user-scalable=no">
    <meta name="format-detection" content="telephone=no"/>
    <meta name="format-detection" content="email=no"/>
    <title>支付结果</title>
    <style type="text/css">
    *{padding:0;margin:0;border:0;outline:0;-webkit-box-sizing:border-box;-moz-box-sizing:border-box;box-sizing:border-box;-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%;-webkit-touch-callout:none;-webkit-appearance:none !important;-webkit-tap-highlight-color:transparent;}html,body{position:relative;max-width:640px;height:100%;min-height:100%;margin:0px auto;font-size:16px;font-family:-apple-system-font,Helvetica Neue,Helvetica,sans-serif;color:#111;background-color:#fff;}.btn-get {width: 100%;height: 40px;line-height: 40px;
    -moz-border-radius: 3px;border-radius: 3px;font-size: 15px;color: #f4fff7;text-align: center;background-color: #309FE6;border: none;outline: 0;}.order_msg{padding-top:4.375rem;text-align:center;}.order_text_area{margin-bottom:1.6rem;padding:0 1.3rem;}.order_msg_title{line-height:1.6;margin-bottom:0.4rem;font-weight:bold;font-size:1.4rem;color:#098AE1;}.order_msg_success,{line-height:1.6;font-size:1rem;color:#999;}.order_items_area{margin:1.3rem 2.3rem;padding:1.4rem 0;border-top:1px solid #f7f7f7;}.order_item_area{display:-webkit-box;display:-webkit-flex;display:flex;line-height:1.875rem;font-size:1.1rem;text-align:left;}.order_item_hd{width:7rem;color:#666;}.order_item_bd{-webkit-box-flex:1;-webkit-flex:1;flex:1;color:#333;}@media screen and (min-height:0px) and (max-height:449px){html{font-size:9px;}}@media screen and (min-height:450px) and (max-height:499px){html{font-size:10px;}}@media screen and (min-height:500px) and (max-height:549px){html{font-size:11px;}}@media screen and (min-height:550px) and (max-height:599px){html{font-size:12px;}}@media screen and (min-height:600px) and (max-height:649px){html{font-size:13px;}}@media screen and (min-height:650px) and (max-height:699px){html{font-size:14.5px;}}@media screen and (min-height:700px) and (max-height:749px){html{font-size:16px;}}@media screen and (min-height:750px) and (max-height:799px){html{font-size:16.5px;}}@media screen and (min-height:800px) and (max-height:849px){html{font-size:17.5px;}}@media screen and (min-height:850px) and (max-height:899px){html{font-size:18.5px;}}@media screen and (min-height:900px) and (max-height:949px){html{font-size:19.5px;}}@media screen and (min-height:950px) and (max-height:999px){html{font-size:20.5px;}}@media screen and (min-height:1000px) and (max-height:1280px){html{font-size:21px;}}@media (min-height:1281px){html{font-size:22px;}}
	</style>
	
	<script type="text/javascript" charset="UTF-8" src="https://wx.gtimg.com/pay_h5/goldplan/js/jgoldplan-1.0.0.js"></script>
	<script type="text/javascript">
		let mchData ={action:'onIframeReady',displayStyle:'SHOW_CUSTOM_PAGE'};//显示当前商家结果页
		//let mchData ={action:'onIframeReady',displayStyle:'SHOW_CUSTOM_PAGE',height:900};//显示当前商家结果页 自定义结果页高度
		//let mchData ={action:'onIframeReady',displayStyle:'SHOW_OFFICIAL_PAGE'};//显示微信官方结果页
		let postData = JSON.stringify(mchData);
		parent.postMessage(postData,'https://payapp.weixin.qq.com');

		//跳到外部页
		function jupout(){
    		let mchData ={action:'jumpOut', jumpOutUrl:'https://www.baidu.com'};
    		let postData = JSON. stringify(mchData);
    		parent.postMessage(postData,'https://payapp.weixin.qq.com');
		}
    </script>
</head>
<body>
    <div class="order_msg">
        <div class="order_text_area">
            <h2 class="order_msg_title order_msg_success">订单支付成功</h2>
        </div>
        <div class="order_items_area">
            <div class="order_item_area">
                <div class="order_item_hd">订单编号</div>
                <div class="order_item_bd">111908590000807251</div>
            </div>
            <div class="order_item_area">
                <div class="order_item_hd">订单金额</div>
                <div class="order_item_bd">¥0.01</div>
				<div class="order_item_bd"></div>
				
            </div>
        </div>
		<button class="btn-get" onclick="jupout()">订单详情</button>
    </div>
</body>
</html>
